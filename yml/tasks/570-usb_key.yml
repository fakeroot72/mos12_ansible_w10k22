- name: create usb key checker with sureruser bit
  ansible.builtin.copy:
    src: bin/usb_key_check_wrapper
    dest: local/usb_key_check_wrapper
    owner: root
    group: root
    mode: 04755

- name: set default polkit-1
  ansible.builtin.copy:
    content: |
      #%PAM-1.0

      auth       include      system-auth
      account    include      system-auth
      password   include      system-auth
      session    include      system-auth
    dest: /etc/pam.d/polkit-1

- name: turn off usb key when gui
  ansible.builtin.blockinfile:
    path: /etc/pam.d/polkit-1
    marker: "### {mark} USB Check 1580 ###"
    insertafter: "#%PAM-1.0"
    state: absent
    content: |
      auth  [success=1 default=ignore] pam_succeed_if.so user != admin
      auth  required pam_exec.so quiet /opt/.lycu1580v2/local/usb_key_check_wrapper

