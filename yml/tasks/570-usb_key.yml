- name: activate usb key login check
  ansible.builtin.blockinfile:
    path: /etc/pam.d/login
    marker: "### {mark} USB Check 1580 ###"
    insertafter: "#%PAM-1.0"
    content: |
      auth  [success=1 default=ignore] pam_succeed_if.so user != admin
      auth  required pam_exec.so quiet /opt/.lycu1580v2/local/usb_key_check_wrapper
  vars:
    usb_key_login_exclude:
      - xm1580-1-205-0
      - xm1580-1-206-0
      - xm1580-1-207-0
      - xm1580-1-208-0
      - xm1580-1-209-0
      - xm1580-1-215-0
      - xm1580-2-418-0
      - xm1580-2-419-0
      - xm1580-2-422-0
      - xm1580-2-425-0
      - xm1580-2-426-0
      - xm1580-2-427-0
      - xn1580-2-it1-0
      - xc1580-2-it2-0
      - xn1580-2-it3-0
      - xn1580-2-it4-0
      - xn1580-4-110-0
      - xn1580-4-209-0
      - xn1580-4-220-0
      - xm1580-4-309-0
      - xn1580-4-309-0
      - xn1580-4-320-0
      - xn1580-4-403-0
  loop:
    - m1580-1-205
    - m1580-1-206
    - m1580-1-207
    - m1580-1-208
    - m1580-1-209
    - m1580-1-215
    - m1580-2-210
    - m1580-2-418
    - n1580-2-418
    - m1580-2-419
    - n1580-2-419
    - n1580-2-420
    - m1580-2-422
    - m1580-2-425
    - m1580-2-426
    - m1580-2-427
    - n1580-2-it1
    - c1580-2-it2
    - n1580-2-it3
    - n1580-2-it4
    - xn1580-4-110
    - xn1580-4-209
    - xn1580-4-220
    - xm1580-4-309
    - xn1580-4-309
    - xn1580-4-320
    - xn1580-4-403
  loop_control:
    loop_var: usb_key_login_item
  when: usb_key_login_item in ansible_hostname and ansible_hostname not in usb_key_login_exclude

- name: set default sddm pam.d
  ansible.builtin.copy:
    content: |
      #%PAM-1.0

      # Block login for root (in GUI through sddm)
      auth         required      pam_succeed_if.so user != root quiet_success

      auth         substack      system-auth
      -auth        optional      pam_gnome_keyring.so
      -auth        optional      pam_kwallet5.so
      -auth        optional      pam_kwallet.so
      auth         include       postlogin
      account      required      pam_nologin.so
      account      include       system-auth
      -password    optional      pam_gnome_keyring.so use_authtok
      password     include       system-auth
      session      required      pam_loginuid.so
      session      optional      pam_keyinit.so force revoke
      session      required      pam_namespace.so
      -session     optional      pam_gnome_keyring.so auto_start
      -session     optional      pam_kwallet5.so auto_start
      -session     optional      pam_kwallet.so auto_start
      session      include       system-auth
      session      include       postlogin
    dest: /etc/pam.d/sddm

- name: activate usb key sddm check
  ansible.builtin.blockinfile:
    path: /etc/pam.d/sddm
    marker: "### {mark} USB Check 1580 ###"
    insertafter: "auth         required      pam_succeed_if.so user != root quiet_success"
    content: |
      auth  [success=1 default=ignore] pam_succeed_if.so user != admin
      auth  required pam_exec.so quiet /opt/.lycu1580v2/local/usb_key_check_wrapper
  vars:
    usb_key_sddm_exclude:
      - xm1580-1-205-0
      - xm1580-1-206-0
      - xm1580-1-207-0
      - xm1580-1-208-0
