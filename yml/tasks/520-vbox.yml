---

- name: install virtualbox
  ansible.builtin.dnf:
    name: virtualbox

- name: add virtualbox network brige to blacklists
  ansible.builtin.copy:
    content: "blacklist vboxnetflt"
    dest: /etc/modprobe.d/blacklist-vboxnetflt.conf
    owner: root
    group: root
    mode: 0644

- name: fix stop vbox brige on exit
  ansible.builtin.replace:
    path: /lib/systemd/system/virtualbox.service
    regexp: '^# ExecStop=/sbin/modprobe -r vboxnetflt$'
    replace: 'ExecStop=/sbin/modprobe -r vboxnetflt'

- name: turn off virtualbox network brige
  ansible.builtin.replace:
    path: /lib/systemd/system/virtualbox.service
    regexp: '^ExecStart=/sbin/modprobe vboxnetflt$'
    replace: '# ExecStart=/sbin/modprobe vboxnetflt'
