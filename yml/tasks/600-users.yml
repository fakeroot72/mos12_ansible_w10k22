    password: "$y$j9T$EC4tuSMQMlwxidcJlCQCq/$/JEJGkoIHW0TYfg58Sbn9P.yO5IQ9ATNmGzMT1S48a4"
    groups: dialout, olymp, student, vboxusers, wheel
  when: "n1580-2-419" in ansible_hostname or "mos-cf6nmg" in ansible_hostname

- name: disable root login
  user:
    name: root
    password: '!'

- name: deny cron use for student and teacher
  ansible.builtin.copy:
    content: |
      olymp
      student
      teacher
    dest: /etc/cron.deny
    owner: root
    group: root
    mode: 0644

- name: deny ssh for student and teacher
  ansible.builtin.copy:
    content: 'DenyUsers olymp student teacher'
    dest: /etc/ssh/sshd_config.d/deny_ssh_student_and_teacher.conf

- name: disable ssh passwords login
  ansible.builtin.copy:
    content: 'PasswordAuthentication no'
    dest: /etc/ssh/sshd_config.d/disable_passords_auth.conf

- name: disable use PAM in sshd
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^UsePAM(.*)$'
    replace: 'UsePAM no'

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted
    daemon_reload: true

- name: install clearing script for student
  ansible.builtin.copy:
    src: files/rc.local
    dest: /etc/rc.local
    owner: root
    group: root
    mode: 0750
