---

- name: create user for pupils
  ansible.builtin.user:
    name: student
    password: "$6$IL7SHzFwRyqpGVpR$oLVkEjqfOOz.9uU2MAwzEZUcxTdC9dkrRtHIbKV6nu/PCNANyQQ8yhsiKmgmgEZI6fPdquDd5aE5EoDcUOOth."
    groups: dialout, vboxusers

- name: create user for olympiads
  ansible.builtin.user:
    name: olymp
    password: "$6$rgp4zdmguxjYZ2Tj$aIRKlvJN32VgY0nfgno/uCJdjnkxyF.0oTqDlF9SC1oJnPcMOcOC7wrOorO9xjJxPOfpHRnDK6ppMMWoX4v0D0"
    groups: dialout, vboxusers

- name: create user for teacher
  ansible.builtin.user:
    name: teacher
    password: "$6$buTXdEN1iPfkP6hw$lJZYntugYdGIw8ehcc3dFdp4.eqN7vzY967zZ0mOeOtGvBAtMRVA2BlCcJ6budwt7KgyodwrkjoKQZFVf7L5g0"
    groups: dialout, olymp, student, vboxusers

- name: change passw for admin
  ansible.builtin.user:
    name: admin
    password: "$6$4IJwkShZEnT4W5Vd$uMb30QX1f/qKDfdbbsgkC1A4FWIBukttmmnpePm0iiaNqEhfQx08ecMPzFENC5iNNikoaFllB19tzG1Kjxdd1/"

- name: deny cron use for student and teacher
  ansible.builtin.copy:
    content: |
      student
      teacher
    dest: /etc/cron.deny
    owner: root
    group: root
    mode: 0644

- name: deny ssh for student and teacher
  ansible.builtin.copy:
    content: 'DenyUsers student teacher'
    dest: /etc/ssh/sshd_config.d/deny_ssh_student_and_teacher.conf

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted
    daemon_reload: true

- name: install clearing script for student
  ansible.builtin.copy:
    src: files/rc.local
    dest: /etc/rc.local
    owner: root
    group: root
    mode: 0750

- name: recover default sddm.conf
  ansible.builtin.copy:
    content: |
      [Theme]
      Current=mos-auth
      [Users]
      MinimumUid=10000000
      MaximumUid=2000000000
    dest: /etc/sddm.conf
    owner: root
    group: root
    mode: 0644

- name: turn on autologin for 1580
  ansible.builtin.copy:
    content: |
      [Autologin]
      #Relogin=false
      #Session=01plasma
      User=student
    dest: /etc/sddm.conf.d/1580.conf
    owner: root
    group: root
    mode: 0644

- name: turn on autologin for 1580 xfce
  ansible.builtin.copy:
    content: |
      [Autologin]
      #Relogin=false
      Session=xfce
      User=student
    dest: /etc/sddm.conf.d/1580.conf
    owner: root
    group: root
    mode: 0644
  loop:
    - xm1580-1-205
    - xm1580-1-206
    - xm1580-1-207
    - xm1580-1-208
    - xm1580-1-209
    - xm1580-1-215
    - xm1580-2-210
    - xm1580-2-418
    - n1580-2-418
    - xm1580-2-419
    - xn1580-2-420
    - xm1580-2-422
    - xm1580-2-425
    - xm1580-2-426
    - xm1580-2-427
    - xn1580-2-it1
    - xc1580-2-it2
    - xn1580-2-it3
    - xn1580-2-it4
  loop_control:
    loop_var: xfce_item
  when: xfce_item in ansible_hostname
