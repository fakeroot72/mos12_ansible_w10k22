- name: configure grub password
  ansible.builtin.copy:
    content: |
      GRUB2_PASSWORD=grub.pbkdf2.sha512.10000.FBAF511E6DFE3A2272108EC61FCDC03F6D4B0211F15BBBEE39ED5EF09883D372D0433824A39641EC210E85B8F9265D1975F458A8055D6FC76663CC063073A029.3A636A82DBA279F6DE19AA462FAA462EF50BE9D4EF27D9A2E4575720DC302EBBA4651DCD0321A8E0C2A489FB5C444757CF6B223DCC6A23DB5AA5A04FD2FB5830
    dest: /boot/grub2/user.cfg
    owner: root
    group: root
    mode: 0600

- name: grub mkconfig
  ansible.builtin.command: "grub2-mkconfig -o /boot/grub2/grub.cfg"
