---

- name: configure grub boot 0 default
  #  ansible.builtin.command: "sed -i 's/GRUB_DEFAULT.*/GRUB_DEFAULT=0/' /etc/default/grub"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^GRUB_DEFAULT=(.*)$'
    replace: 'GRUB_DEFAULT=0'

- name: set grub password only for editing
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    line: "GRUB_PASSWORD_PROTECT_ONLY_EDITING=true"
    state: present

- name: delete configure grub password
  ansible.builtin.file:
    path: /boot/grub2/user.cfg
    state: absent

- name: configure grub password
  ansible.builtin.copy:
    content: |
      GRUB2_PASSWORD=grub.pbkdf2.sha512.10000.F6ADA5F1E502F41E940A0C04F87AA537EDF8FDA96B939F7F33D955A36C7FC43859B8135F2A38017A3601BD9A515FEC1B38A81A59D253C2A0BD2F7C95789CB085.6C86CE7B9777F891D1C1EC62181EF8D1DB81AEE20E53672B9AE96E42CBE8B9DA3B20BEB140857251E14BDC13231E5B5A725ED42BDB043723A40D8DA37CB9044D
    dest: /boot/grub2/user.cfg
    owner: root
    group: root
    mode: 0600
      #  vars:
      #    grub_exclude:
      # - nowhere
      #loop:
      #- m1580-1-205
      #- m1580-1-206
      #- m1580-1-207
      #- m1580-1-208
      #- m1580-1-209
      #- m1580-1-215
      #- 1580-2-418
      #loop_control:
      #loop_var: grub_item
      #when: grub_item in ansible_hostname and ansible_hostname not in grub_exclude

- name: grub mkconfig
  ansible.builtin.command: "grub2-mkconfig -o /boot/grub2/grub.cfg"
