---

- name: configure grub boot 0 default
  #  ansible.builtin.command: "sed -i 's/GRUB_DEFAULT.*/GRUB_DEFAULT=0/' /etc/default/grub"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^GRUB_DEFAULT=(.*)$'
    replace: 'GRUB_DEFAULT=0'

- name: set grub password only for editing
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    line: "GRUB_PASSWORD_PROTECT_ONLY_EDITING=true"
    state: present

- name: delete configure grub password
  ansible.builtin.file:
    path: /boot/grub2/user.cfg
    state: absent

- name: configure grub password
  ansible.builtin.copy:
    content: |
      GRUB2_PASSWORD=grub.pbkdf2.sha512.10000.6B87800F1106D65D7FFB3CC0C92D28063D2CA087DAEAC7F29F2E8AD23E2B693953ACE4DC5C1855644013B3D6D043F9A73D6037D07340F004C2388A6EDDB043E0.39EFC7AE15E0FDBB58053D0D1CB0247A50A44D853CFA27257CB314B7C143DD6B7EBED2ADF81822B9DA37A9A8F23C7CBBF0492B0A0345EF589FA25B07261CA5F2
    dest: /boot/grub2/user.cfg
    owner: root
    group: root
    mode: 0600
  vars:
    grub_exclude:
      - nowhere
  loop:
    - m1580-1-205
    - m1580-1-206
    - m1580-1-207
    - m1580-1-208
    - m1580-1-209
    - m1580-1-215
    - 1580-2-418
  loop_control:
    loop_var: grub_item
  when: grub_item in ansible_hostname and ansible_hostname not in grub_exclude

- name: grub mkconfig
  ansible.builtin.command: "grub2-mkconfig -o /boot/grub2/grub.cfg"
