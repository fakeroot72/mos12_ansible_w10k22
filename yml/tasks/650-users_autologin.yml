---

- name: delete 1580.conf
  ansible.builtin.file:
    path: /etc/sddm.conf.d/1580.conf
    state: absent

- name: delete /etc/sddm.conf.d/1580-autologin-user.conf
  ansible.builtin.file:
    path: /etc/sddm.conf.d/1580-autologin-user.conf
    state: absent

- name: delete /etc/sddm.conf.d/1580-autologin-session.conf
  ansible.builtin.file:
    path: /etc/sddm.conf.d/1580-autologin-session.conf
    state: absent

- name: disable default sddm.conf
  ansible.builtin.copy:
    content: |
      #[Theme]
      #Current=mos-auth
      #[Users]
      #MinimumUid=10000000
      #MaximumUid=2000000000
    dest: /etc/sddm.conf
    owner: root
    group: root
    mode: 0644

- name: add autologin for student
  ansible.builtin.copy:
    content: |
      [Autologin]
      #Relogin=false
      #Session=01plasma
      User=student
    dest: /etc/sddm.conf.d/zzz1580-autologin-user.conf
    owner: root
    group: root
    mode: 0644

- name: set default session
  ansible.builtin.copy:
    content: |
      #[Autologin]
      #Relogin=false
      #Session=xfce
    dest:  /etc/sddm.conf.d/zzz1580-autologin-session.conf
    owner: root
    group: root
    mode: 0644

- name: select xfce session
  ansible.builtin.copy:
    content: |
      [Autologin]
      #Relogin=false
      Session=xfce
    dest:  /etc/sddm.conf.d/zzz1580-autologin-session.conf
    owner: root
    group: root
    mode: 0644
  loop:
    - xm1580-1-205
    - xm1580-1-206
    - xm1580-1-207
    - xm1580-1-208
    - xm1580-1-209
    - xm1580-1-215
    - xm1580-2-210
    - xm1580-2-418
    - xn1580-2-418
    - xm1580-2-419
    - xn1580-2-420
    - xm1580-2-422
    - xm1580-2-425
    - xm1580-2-426
    - xm1580-2-427
    - xn1580-2-it1
    - xc1580-2-it2
    - xn1580-2-it3
    - xn1580-2-it4
  loop_control:
    loop_var: xfce_item
  when: xfce_item in ansible_hostname
