---

  - name: check if /opt/.lycu1580/local/ exist or not
    ansible.builtin.stat:
      path: /tmp/ansible-rc.local.log1
    register: tmp_ansible_rc_local_log

  - name: remove w10pabc.vdi
    ansible.builtin.file:
      path: "{{ base_path }}/local/w10pabc_vdi/"
      state: absent
    when: "w10pabc_item_r in ansible_hostname"
    loop: "{{ w10pabc_r }}"
    loop_control:
      loop_var: w10pabc_item_r

  - name: download w10pabc.vdi
    ansible.builtin.command: "bin/download_file.sh {{ base_path }}/files/w10pabc_vdi_bz_md5/ {{ base_path }}/local/w10pabc_vdi/ {{ base_path }}/local/w10pabc_vdi/w10pabc.vdi {{ base_url }}/mos12_ansible/w10pabc_vdi_bz/ ready01.timestamp"
    loop: "{{ w10pabc }}"
    when: w10pabc_item in ansible_hostname
    loop_control:
      loop_var: w10pabc_item


  - name: remove w10k22.vdi
    ansible.builtin.file:
