---

- name: remove processing.tar
  ansible.builtin.file:
    path: "{{ base_path }}/local/processing_tar/"
    state: absent
  loop: "{{ processing_r }}"
  loop_control:
    loop_var: processing_item_r
  when: processing_item_r in ansible_hostname

- name: download processing.tar
  ansible.builtin.command: "bin/download_folder.sh {{ base_path }}/files/processing_tar_bz_md5/ {{ base_path }}/local/processing_tar/ {{ base_path }}/local/processing_tar/processing.tar {{ base_url }}/mos12_ansible/processing_tar_bz/ ready01.timestamp {{ base_path }}/local/processing_tar//processing/"
  loop: "{{ processing }}"
  loop_control:
    loop_var: processing_item
  when: processing_item in ansible_hostname


