    ansible.builtin.command: "bin/download_file.sh {{ base_path }}/files/w10ev3_vdi_bz_md5/ {{ base_path }}/local/w10ev3_vdi/ {{ base_path }}/local/w10ev3_vdi/w10ev3.vdi {{ base_url }}/mos12_ansible/w10ev3_vdi_bz/ ready01.timestamp"
