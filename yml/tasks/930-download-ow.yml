---

- name: create olymp-windows_vdi directory
  ansible.builtin.file:
    path: "{{ base_path }}/local/olymp-windows_vdi/"
    state: directory
    owner: ansible
    group: ansible
    mode: 0755
  loop: "{{ olymp_windows }}"
  loop_control:
    loop_var: olymp_windows_item_d
  when: olymp_windows_item_d in ansible_hostname

- name: download olymp-windows
  ansible.builtin.get_url:
    url: http://10.171.219.67/vdi/olymp-windows.vdi.gz
    dest: "{{ base_path }}/local/olymp-windows_vdi/olymp-windows.vdi"
    checksum: md5:http://10.171.219.67/vdi/olymp-windows.vdi.md5
  loop: "{{ olymp_windows }}"
  loop_control:
    loop_var: olymp_windows_item_f
  when: olymp_windows_item_f in ansible_hostnam


- name: delete olymp-windows_vdi directory
  ansible.builtin.file:
    path: "{{ base_path }}/local/olymp-windows_vdi/"
    state: absent
    owner: ansible
    group: ansible
    mode: 0755
  loop: "{{ olymp_windows_r }}"
  loop_control:
    loop_var: olymp_windows_r_item
  when: olymp_windows_r_item in ansible_hostname
