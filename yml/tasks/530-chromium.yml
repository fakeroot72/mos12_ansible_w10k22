---

- name: set chromium flags
  ansible.builtin.copy:
    dest: /etc/profile.d/10-chromium-default-incognito.sh
    content: |
      #!/bin/sh
      export CHROMIUM_USER_FLAGS="--incognito"
    owner: root
    group: root
    mode: 0755

- name: create chromium politics directory
  ansible.builtin.file:
    path: "/etc/chromium/policies/managed/"
    state: directory
    owner: root
    group: root
    mode: 0755

- name: set chromium politics
  ansible.builtin.copy:
    dest: /etc/chromium/policies/managed/policies.json
    content: |
      {
        "HomepageLocation": "sdo.1580.ru",
        "URLBlocklist": ["*"],
        "URLAllowlist": ["1580.ru", "author.today", "fipi.ru", "geogebra.org", "gmail.com", "google.com", "cdn.jsdelivr.net", "kompege.ru", "lbz.ru", "liveinternet.ru", ".mail.ru", "scratch.mit.edu", "moodle.com", "mos.ru", "programforyou.ru", "silvertests.ru", "kpolyakov.spb.ru", "tinkercad.com", "wokwi.com", "ya.ru", "counter.yadro.ru", "disk.yandex.ru", "education.yandex.ru", "mail.yandex.ru", "music.yandex.ru", "radio.yandex.ru"],
      }
    owner: root
    group: root
    mode: 0644
