---

- name: set chromium flags - disable
  ansible.builtin.copy:
    dest: /etc/profile.d/10-chromium-default-incognito.sh
    content: |
      #!/bin/sh
      export CHROMIUM_USER_FLAGS="--incognito"
    owner: root
    group: root
    mode: 0755

- name: create chromium politics directory
  ansible.builtin.file:
    path: "/etc/chromium/policies/managed/"
    state: directory
    owner: root
    group: root
    mode: 0755

- name: set chromium politics
  ansible.builtin.copy:
    content: |
      {
        "HomepageLocation":               "https://sdo.1580.ru",
        "HomepageIsNewTabPage":           true,
        "NewTabPageLocation":             "https://sdo.1580.ru",
        "DefaultNotificationsSetting":    2,
        "DefaultPopupsSetting":           2,
        "PasswordManagerEnabled":         false,
        "BlockExternalExtensions":        true,
        "BackgroundModeEnabled":          false,
        "BrowserAddPersonEnabled":        false,
        "ChromeAppsEnabled":              false,
        "DefaultSearchProviderEnabled":   true,
        "DefaultSearchProviderSearchURL": "https://ya.ru/search/?text={searchTerms}",
        "DefaultSearchProviderName":       "Яндекс",
        ]
      }
    dest: /etc/chromium/policies/managed/policies.json
    owner: root
    group: root
