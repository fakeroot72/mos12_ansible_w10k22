---

- name: set chromium flags
  ansible.builtin.copy:
    dest: /etc/profile.d/10-chromium-default-incognito.sh
    content: |
      #!/bin/sh
      export CHROMIUM_USER_FLAGS="--incognito"
    owner: root
    group: root
    mode: 0755

- name: create chromium politics directory
  ansible.builtin.file:
    path: "/etc/chromium/policies/managed/"
    state: directory
    owner: root
    group: root
    mode: 0755

- name: set chromium politics
  ansible.builtin.copy:
    src: files/chromium-policies.json
    dest: /etc/chromium/policies/managed/policies.json
    owner: root
    group: root

- name: set chromium politics white
  ansible.builtin.copy:
    src: files/chromium-policies-white.json
    dest: /etc/chromium/policies/managed/policies.json
    owner: root
    group: root
    mode: 0644
    mode: 0644
  loop: "{{ chromium_white }}"
  loop_control:
    loop_var: chromium_white_item
  when: chromium_white_item in ansible_hostname and ansible_hostname not in chromium_white_exclude
