---

- name: set default /etc/hosts
  ansible.builtin.copy:
    content: |
      127.0.0.1               localhost.localdomain localhost
      ::1             localhost6.localdomain6 localhost6
    dest: /etc/hosts

- name: set /etc/hosts
  ansible.builtin.copy:
    content: |
      127.0.0.1       localhost.localdomain localhost
      ::1             localhost6.localdomain6 localhost6
      172.18.164.66   sdo.1580.ru
      172.18.164.66   tp.1580.ru
    dest: /etc/hosts
  vars:
    hosts_exclude:
      - nowrere
  loop:
    - xm1580-2-210
    - xm1580-2-418
    - xn1580-2-418
    - xm1580-2-419
    - xn1580-2-420
    - xm1580-2-422
    - xm1580-2-425
    - xm1580-2-426
    - xm1580-2-427
  loop_control:
    loop_var: hosts_item
  when: hosts_item in ansible_hostname and ansible_hostname not in hosts_exclude

- name: set /etc/hosts in 1580-2-it
  ansible.builtin.copy:
    content: |
      127.0.0.1       localhost.localdomain localhost
      ::1             localhost6.localdomain6 localhost6
      172.20.20.101   sdo.1580.ru
    dest: /etc/hosts
  vars:
    hostsit_exclude:
      - nowrere
  loop:
    - xn1580-2-it1
    - xc1580-2-it2
    - xn1580-2-it3
    - xn1580-2-it4
  loop_control:
    loop_var: hostsit_item
  when: hostsit_item in ansible_hostname and ansible_hostname not in hostsit_exclude
