---

- name: set default /etc/hosts
  ansible.builtin.copy:
    content: |
      127.0.0.1               localhost.localdomain localhost
      ::1             localhost6.localdomain6 localhost6
    dest: /etc/hosts

- name: set /etc/hosts
  ansible.builtin.copy:
    content: |
      127.0.0.1       localhost.localdomain localhost
      ::1             localhost6.localdomain6 localhost6
      172.18.164.66   sdo.1580.ru
    dest: /etc/hosts
  vars:
    hosts_exclude:
      - nowrere
  loop:
    - xm1580-1-205
    - xm1580-1-206
    - xm1580-1-207
    - xm1580-1-208
    - xm1580-1-209
    - xm1580-1-215
    - m1580-2-210
    - m1580-2-418
    - n1580-2-418
    - m1580-2-419
    - n1580-2-420
    - m1580-2-422
    - m1580-2-425
    - m1580-2-426
    - m1580-2-427
    - xn1580-2-it1
    - xc1580-2-it2
    - xn1580-2-it3
    - xn1580-2-it4
    - xn1580-4-110
    - xn1580-4-209
    - xn1580-4-220
    - xm1580-4-309
    - xn1580-4-309
    - xn1580-4-320
    - xn1580-4-403
  loop_control:
    loop_var: hosts_item
  when: hosts_item in ansible_hostname and ansible_hostname not in hosts_exclude
