---

- name: install snapd
  ansible.builtin.dnf:
    name:
    - snapd

- name: pause for 10 seconds
  ansible.builtin.pause:
    seconds: 10

- name: install snapd snap package
#  community.general.snap:
#    name: snapd
#    state: present
##    classic: yes
  ansible.builtin.command: "snap install snapd"

- name: install processing snap package
#  community.general.snap:
#    name: processing
#    state: present
#    classic: yes
  ansible.builtin.command: "snap install processing --classic"
