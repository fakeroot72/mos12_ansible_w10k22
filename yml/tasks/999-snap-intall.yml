---

- name: Получить факты о пакетах
  package_facts:
    manager: auto

- name: refresh snap 
  ansible.builtin.command: "snap refresh"
  when: "'snapd' in ansible_facts.packages"

- name: install snapd snap package
  ansible.builtin.command: "snap install snapd"
  when: "'snapd' in ansible_facts.packages"

- name: install processing snap package
  ansible.builtin.command: "snap install processing --classic"
  when: "'snapd' in ansible_facts.packages"

- name: install intellij-idea snap package
  ansible.builtin.command: "snap install intellij-idea-community --classic"
  vars:
    install_intellij_idea_exclude:
      - nowhwre
  loop:
    - x1580-1
    - x1580-2-418
    - x1580-2-419
  loop_control:
    loop_var: install_intellij_idea
  when: install_intellij_idea in ansible_hostname and ansible_hostname not in install_intellij_idea_exclude and 'snapd' in ansible_facts.packages

- name: install ghidra snap package
  ansible.builtin.command: "snap install ghidra"
  vars:
    install_ghidra_exclude:
      - nowhwre
  loop:
    - x1580-1
    - x1580-2-418
    - x1580-2-419
  loop_control:
    loop_var: install_ghidra
  when: install_ghidra in ansible_hostname and ansible_hostname not in install_ghidra_exclude and 'snapd' in ansible_facts.packages

- name: install snapd if in absent for next run
  ansible.builtin.dnf:
    name:
    - snapd
  when: "'snapd' not in ansible_facts.packages"

- name: set proxy for snapd
  ansible.builtin.copy:
    dest: /etc/sysconfig/snapd
    content: |
      SNAP_REEXEC=0
      http_proxy="http://squid.1580.ru:80"
      https_proxy="http://squid.1580.ru:80"

- name: restart snapd
  ansible.builtin.systemd:
    name: snapd
    # enabled: true
    state: started
