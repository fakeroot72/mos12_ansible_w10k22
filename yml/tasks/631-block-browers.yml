---

- name: grant access to browser only for olymp
  ansible.builtin.file:
    path: "{{ browser_item }}"
    group: olymp
    mode: 0755
  loop:
    - /usr/lib64/firefox/firefox
    - /usr/lib64/firefox/firefox-bin
    - /opt/yandex/browser/yandex-browser
    - /opt/yandex/browser/yandex_browser
  loop_control:
    loop_var: browser_item
