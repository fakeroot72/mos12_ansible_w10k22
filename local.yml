---

- hosts: localhost
  name: configure PC for school 1580
  user: root
  connection: local
  become: yes
  collections:
    - community.general

#  pre_tasks:

  tasks:

  - name: collect vars
    ansible.builtin.find:
      paths: yml/vars/
      patterns: '*.yml'
    register: find_vars

  - name: include vars
    include_vars: "{{ item.path }}"
    with_items: "{{ find_vars.files }}"


  - name: collect tasks
    ansible.builtin.find:
      paths: yml/tasks/
      patterns: '*.yml'
    register: find_tasks

  - name: include tasks
    include_tasks: "{{ item.path }}"
    with_items: "{{ find_tasks.files | sort(attribute='path')}}"
