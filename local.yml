---

- hosts: localhost
  name: configure PC for school 1580
  user: root
  connection: local
  become: yes
  collections:
    - community.general
  vars:
    base_name: "mos12_ansible"
    base_path: "/opt/.lycu1580v2/"
    base_url: "http://bf726e13342a.hosting.myjino.ru/"
    base_version: "v2"

#  pre_tasks:

  tasks:

  - name: collect vars
    ansible.builtin.find:
      paths: yml/vars/
      patterns: '*.yml'
    register: find_vars

  - name: include vars
    include_vars: "{{ item.path }}"
    with_items: "{{ find_vars.files }}"


  - name: collect tasks
    ansible.builtin.find:
      paths: yml/tasks/
      patterns: '*.yml'
    register: find_tasks

  - name: include tasks
    include_tasks: "{{ item.path }}"
    with_items: "{{ find_tasks.files | sort(attribute='path')}}"
